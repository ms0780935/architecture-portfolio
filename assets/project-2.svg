<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8f8f6"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#111" stroke-width="1.2" />
    </pattern>
  </defs>
  <!-- Hill slope -->
  <path d="M 50 200 L 250 280 L 500 450 L 750 540 L 750 600 L 50 600 Z" fill="url(#hatch)" opacity="0.15"/>
  <path d="M 50 200 L 250 280 L 500 450 L 750 540" fill="none" stroke="#111" stroke-width="2.5"/>
  <!-- Stepped residential units -->
  <!-- Block A -->
  <rect x="180" y="180" width="140" height="90" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="180" y1="225" x2="320" y2="225" stroke="#111" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="220" y="235" width="25" height="35" fill="none" stroke="#111" stroke-width="1"/>
  <!-- Block B (terraced down) -->
  <rect x="300" y="270" width="160" height="110" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="300" y1="325" x2="460" y2="325" stroke="#111" stroke-width="1" stroke-dasharray="4 2"/>
  <!-- Balcony cantilever -->
  <line x1="460" y1="270" x2="495" y2="270" stroke="#111" stroke-width="2"/>
  <line x1="495" y1="270" x2="495" y2="295" stroke="#111" stroke-width="1"/>
  <!-- Block C -->
  <rect x="420" y="380" width="180" height="110" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="420" y1="435" x2="600" y2="435" stroke="#111" stroke-width="1" stroke-dasharray="4 2"/>
  <!-- Circulation stair -->
  <path d="M 280 270 L 300 270 L 300 290 L 320 290 L 320 310 L 340 310" fill="none" stroke="#111" stroke-width="1.2"/>
  <!-- Level datum lines -->
  <line x1="620" y1="180" x2="720" y2="180" stroke="#888" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="630" y="175" font-family="monospace" font-size="10" fill="#555">▼ +18.40m</text>
  <line x1="620" y1="270" x2="720" y2="270" stroke="#888" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="630" y="265" font-family="monospace" font-size="10" fill="#555">▼ +12.00m</text>
  <line x1="620" y1="380" x2="720" y2="380" stroke="#888" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="630" y="375" font-family="monospace" font-size="10" fill="#555">▼ +04.20m</text>
  <text x="60" y="80" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="18" fill="#111" letter-spacing="3">FIG. 02 / SECTION PERSPECTIVE</text>
  <text x="60" y="105" font-family="sans-serif" font-size="11" fill="#777" letter-spacing="1">STUDIO IV · HILLSIDE RESIDENTIAL TYPOLOGY</text>
</svg>