<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8f8f6"/>
  <!-- Exploded structural tower -->
  <g stroke="#111" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Level 3 (Roof farm) -->
    <polygon points="300,120 480,180 480,210 300,150" fill="#fff" stroke="#111"/>
    <polygon points="480,180 620,130 620,160 480,210" fill="#ecebe4" stroke="#111"/>
    <polygon points="300,120 440,70 620,130 480,180" fill="#dedbd0" stroke="#111"/>
    <!-- Level 2 (Housing cluster) -->
    <polygon points="300,240 480,300 480,340 300,280" fill="#fff" stroke="#111"/>
    <polygon points="480,300 620,250 620,290 480,340" fill="#ecebe4" stroke="#111"/>
    <polygon points="300,240 440,190 620,250 480,300" fill="#fff" stroke="#111"/>
    <!-- Level 1 (Public Market) -->
    <polygon points="300,380 480,440 480,490 300,430" fill="#fff" stroke="#111"/>
    <polygon points="480,440 620,390 620,440 480,490" fill="#ecebe4" stroke="#111"/>
    <polygon points="300,380 440,330 620,390 480,440" fill="#fff" stroke="#111"/>
    <!-- Vertical circulation cores -->
    <line x1="440" y1="70" x2="440" y2="470" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="300" y1="120" x2="300" y2="430" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="620" y1="130" x2="620" y2="440" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
  <text x="60" y="80" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="18" fill="#111" letter-spacing="3">FIG. 04 / EXPLODED AXONOMETRIC</text>
  <text x="60" y="105" font-family="sans-serif" font-size="11" fill="#777" letter-spacing="1">STUDIO VIII · VERTICAL ECOLOGICAL COMMONS</text>
</svg>