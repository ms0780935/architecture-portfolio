  <rect x="560" y="340" width="110" height="130" fill="#222"/>
  <!-- Wind Streamlines with velocity colors -->
  <path d="M 80 300 C 180 300 240 290 320 295 C 400 300 480 290 540 300 L 720 300" stroke="#c04e28" stroke-width="3" fill="none" stroke-linecap="round"/>
