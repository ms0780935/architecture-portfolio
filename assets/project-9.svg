  <text x="60" y="80" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="18" fill="#111" letter-spacing="3">FIG. 09 / CFD WIND VELOCITY VECTOR</text>
  <text x="60" y="105" font-family="sans-serif" font-size="11" fill="#777" letter-spacing="1">RESEARCH THESIS · SUBTROPICAL CANYON MICROCLIMATE</text>
