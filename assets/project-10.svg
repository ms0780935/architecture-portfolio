<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8f8f6"/>
  <!-- Space Syntax Axial Graph -->
  <g stroke-linecap="round">
    <line x1="120" y1="200" x2="680" y2="400" stroke="#c04e28" stroke-width="3.5"/> <!-- High Integration (Red) -->
    <line x1="200" y1="120" x2="350" y2="520" stroke="#e27c38" stroke-width="2.5"/> <!-- Medium Integration (Orange) -->
    <line x1="450" y1="100" x2="520" y2="500" stroke="#d49b35" stroke-width="2"/>
    <line x1="100" y1="360" x2="650" y2="220" stroke="#c04e28" stroke-width="3"/>
    <line x1="280" y1="140" x2="600" y2="160" stroke="#5a827e" stroke-width="1.5"/> <!-- Low Integration (Teal) -->
    <line x1="150" y1="440" x2="550" y2="460" stroke="#5a827e" stroke-width="1.5"/>
    <line x1="580" y1="220" x2="720" y2="480" stroke="#486581" stroke-width="1.2"/> <!-- Segregated (Blue) -->
  </g>
  <!-- Node Intersections -->
  <circle cx="370" cy="289" r="6" fill="#111"/>
  <circle cx="282" cy="319" r="6" fill="#111"/>
  <circle cx="488" cy="330" r="6" fill="#111"/>
  <text x="60" y="80" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="18" fill="#111" letter-spacing="3">FIG. 10 / SPACE SYNTAX AXIAL MAP</text>
  <text x="60" y="105" font-family="sans-serif" font-size="11" fill="#777" letter-spacing="1">RESEARCH · TOPOLOGICAL ACCESSIBILITY ANALYSIS</text>
</svg>