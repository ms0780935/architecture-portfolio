<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <!-- Architectural Modular Grid -->
    <pattern id="arch-grid-small" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8e6df" stroke-width="0.5"/>
    </pattern>
    <pattern id="arch-grid-large" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#arch-grid-small)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#dad7cd" stroke-width="0.8"/>
    </pattern>
    <!-- Wind Streamline Gradient -->
    <linearGradient id="wind-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a7b88" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#2a7b88" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2a7b88" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Solar Ray Gradient -->
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e08a3c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e08a3c" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Editorial Background Paper Canvas -->
  <rect width="1200" height="850" fill="#fcfbf8"/>
  <rect width="1200" height="850" fill="url(#arch-grid-large)"/>

  <!-- Border & Publication Margin -->
  <rect x="35" y="35" width="1130" height="780" fill="none" stroke="#111111" stroke-width="1.2"/>
  <rect x="39" y="39" width="1122" height="772" fill="none" stroke="#e3e1da" stroke-width="0.6"/>

  <!-- ========================================================================
       TOP HEADER & ARCHITECTURAL TITLE BLOCK
       ======================================================================== -->
  <g font-family="'Cinzel', 'Noto Serif TC', serif">
    <text x="65" y="78" font-size="20" font-weight="700" fill="#111111" letter-spacing="3">FIG. 01 / 1:20 等角透視軸測構造分解與微氣候流場分析</text>
    <text x="65" y="98" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="11" fill="#777777" letter-spacing="1.5">ARC-101 · 空間微風：輕質木構與重力感知實驗亭 · 1ST YEAR BASIC DESIGN I</text>
  </g>
  <line x1="65" y1="110" x2="1135" y2="110" stroke="#111111" stroke-width="1"/>

  <!-- ========================================================================
       SITE TOPOGRAPHY & CONTOUR LINES (學校中庭草坡微懸浮基地)
       ======================================================================== -->
  <g stroke="#8c8980" stroke-width="0.8" fill="none" stroke-dasharray="4 3">
    <path d="M 65 680 Q 300 660 600 700 T 1135 670" />
    <path d="M 65 710 Q 320 690 620 730 T 1135 700" />
    <path d="M 65 740 Q 340 720 640 760 T 1135 730" stroke="#b5b2a8"/>
  </g>
  <text x="75" y="700" font-family="'SF Mono', monospace" font-size="9" fill="#888">CONTOUR +1.20m (CAMPUS COURTYARD SLOPE)</text>
  <text x="75" y="730" font-family="'SF Mono', monospace" font-size="9" fill="#aaa">CONTOUR +0.80m</text>

  <!-- ========================================================================
       SOLAR INCIDENCE & MICRO-CLIMATE WIND STREAMLINES (微氣候風向與日光穿透)
       ======================================================================== -->
  <!-- Afternoon Sun Incline -->
  <polygon points="280,130 520,380 440,580 180,330" fill="url(#sun-grad)"/>
  <line x1="280" y1="130" x2="480" y2="350" stroke="#e08a3c" stroke-width="1" stroke-dasharray="6 3"/>
  <circle cx="280" cy="130" r="5" fill="#e08a3c"/>
  <text x="295" y="135" font-family="'SF Mono', monospace" font-size="10" fill="#a44117" font-weight="700">SOLAR ANGLE 48° (SUMMER SOLSTICE)</text>

  <!-- Wind Flow Streamlines (中庭微風穿透折板流向) -->
  <g fill="none" stroke="url(#wind-grad)" stroke-width="2" stroke-linecap="round">
    <path d="M 80 430 Q 320 370 540 400 T 950 420"/>
    <path d="M 100 460 Q 340 400 560 430 T 980 450"/>
    <path d="M 120 490 Q 360 430 580 460 T 1000 480"/>
    <path d="M 90 390 Q 310 330 530 360 T 940 380"/>
  </g>
  <!-- Wind direction vector arrowheads -->
  <polygon points="950,420 940,415 940,425" fill="#2a7b88"/>
  <polygon points="980,450 970,445 970,455" fill="#2a7b88"/>
  <polygon points="1000,480 990,475 990,485" fill="#2a7b88"/>
  <text x="880" y="405" font-family="'SF Mono', monospace" font-size="10" fill="#2a7b88" font-weight="700">PREVAILING BREEZE 2.4 m/s →</text>

  <!-- ========================================================================
       PRIMARY AXONOMETRIC TIMBER PAVILION (1:20 輕質互承木構主體)
       ======================================================================== -->
  <!-- Floating Plinth (微懸浮木平台基座) -->
  <g stroke="#111111" stroke-width="1.6" fill="none">
    <!-- Plinth Top Surface -->
    <polygon points="340,540 600,660 880,550 620,440" fill="#edebe3" fill-opacity="0.8"/>
    <!-- Plinth Thickness Edge -->
    <polygon points="340,540 340,558 600,678 600,660" fill="#dedbd0"/>
    <polygon points="600,660 600,678 880,568 880,550" fill="#c7c3b4"/>
    
    <!-- Plinth Timber Decking Slats -->
    <g stroke="#9c9789" stroke-width="0.8">
      <line x1="375" y1="528" x2="635" y2="648"/>
      <line x1="410" y1="515" x2="670" y2="635"/>
      <line x1="445" y1="503" x2="705" y2="623"/>
      <line x1="480" y1="490" x2="740" y2="610"/>
      <line x1="515" y1="478" x2="775" y2="598"/>
      <line x1="550" y1="465" x2="810" y2="585"/>
      <line x1="585" y1="453" x2="845" y2="573"/>
    </g>

    <!-- Floating Steel Footing Shoes (離地懸浮微點柱基礎) -->
    <g stroke="#111" stroke-width="1.4" fill="#555">
      <!-- Footing 1 -->
      <line x1="340" y1="558" x2="340" y2="595" stroke="#111" stroke-width="2.5"/>
      <circle cx="340" cy="595" r="4" fill="#a44117"/>
      <!-- Footing 2 -->
      <line x1="600" y1="678" x2="600" y2="715" stroke="#111" stroke-width="2.5"/>
      <circle cx="600" cy="715" r="4" fill="#a44117"/>
      <!-- Footing 3 -->
      <line x1="880" y1="568" x2="880" y2="605" stroke="#111" stroke-width="2.5"/>
      <circle cx="880" cy="605" r="4" fill="#a44117"/>
      <!-- Footing 4 -->
      <line x1="620" y1="458" x2="620" y2="495" stroke="#111" stroke-width="2.5"/>
      <circle cx="620" cy="495" r="4" fill="#a44117"/>
    </g>
  </g>

  <!-- Main Structural Posts (2寸×2寸 台灣柳杉複合主柱) -->
  <g stroke="#111111" stroke-width="1.8" stroke-linecap="round" fill="none">
    <!-- Column 1 (Front Left) -->
    <line x1="390" y1="520" x2="390" y2="230"/>
    <line x1="398" y1="524" x2="398" y2="234" stroke="#a44117" stroke-width="1.2"/>
    <!-- Column 2 (Front Center) -->
    <line x1="580" y1="610" x2="580" y2="310"/>
    <line x1="588" y1="614" x2="588" y2="314" stroke="#a44117" stroke-width="1.2"/>
    <!-- Column 3 (Right) -->
    <line x1="820" y1="525" x2="820" y2="235"/>
    <line x1="828" y1="529" x2="828" y2="239" stroke="#a44117" stroke-width="1.2"/>
    <!-- Column 4 (Back Center) -->
    <line x1="630" y1="455" x2="630" y2="175"/>
    <line x1="638" y1="459" x2="638" y2="179" stroke="#a44117" stroke-width="1.2"/>
  </g>

  <!-- Reciprocal Timber Joinery Lattice (相互疊加互承木構架) -->
  <g stroke="#111111" stroke-width="1.4" fill="none">
    <!-- Primary Beams -->
    <line x1="370" y1="230" x2="650" y2="340"/>
    <line x1="650" y1="340" x2="840" y2="245"/>
    <line x1="840" y1="245" x2="610" y2="160"/>
    <line x1="610" y1="160" x2="370" y2="230"/>

    <!-- Diagonal Wind-Bracing Struts (斜向抗剪穩定撐桿) -->
    <line x1="390" y1="410" x2="500" y2="280" stroke="#a44117" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="580" y1="490" x2="720" y2="360" stroke="#a44117" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="820" y1="420" x2="710" y2="200" stroke="#a44117" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="630" y1="360" x2="480" y2="200" stroke="#a44117" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Slanted Aerodynamic Folded Timber Canopy (順應風向之折板木棚架) -->
    <!-- Tier 1 Lower Fold Plate -->
    <polygon points="350,220 570,330 720,270 510,170" fill="#d9d5c7" fill-opacity="0.6"/>
    <!-- Tier 2 Upper Fold Plate (Ventilated Scoop) -->
    <polygon points="460,190 680,300 850,225 640,130" fill="#c4bead" fill-opacity="0.7"/>

    <!-- Slatted Timber Fins (遮陽與導風微百葉木欞) -->
    <g stroke="#333" stroke-width="1.1">
      <line x1="370" y1="215" x2="520" y2="165"/>
      <line x1="400" y1="230" x2="550" y2="180"/>
      <line x1="430" y1="245" x2="580" y2="195"/>
      <line x1="460" y1="260" x2="610" y2="210"/>
      <line x1="490" y1="275" x2="640" y2="225"/>
      <line x1="520" y1="290" x2="670" y2="240"/>
      <line x1="550" y1="305" x2="700" y2="255"/>
      <!-- Upper Tier Fins -->
      <line x1="490" y1="180" x2="660" y2="125"/>
      <line x1="520" y1="195" x2="690" y2="140"/>
      <line x1="550" y1="210" x2="720" y2="155"/>
      <line x1="580" y1="225" x2="750" y2="170"/>
      <line x1="610" y1="240" x2="780" y2="185"/>
      <line x1="640" y1="255" x2="810" y2="200"/>
    </g>
  </g>

  <!-- Gravitational Load Perception Paths (重力載重傳遞感知箭頭) -->
  <g fill="#a44117" stroke="#a44117" stroke-width="1.5">
    <!-- Load arrows pointing downward on columns -->
    <path d="M 394 360 L 394 385 M 391 380 L 394 388 L 397 380"/>
    <path d="M 584 450 L 584 475 M 581 470 L 584 478 L 587 470"/>
    <path d="M 824 370 L 824 395 M 821 390 L 824 398 L 827 390"/>
    <text x="408" y="380" font-family="'SF Mono', monospace" font-size="9" font-weight="700">P_GRAVITY = 4.2 kN</text>
    <text x="598" y="470" font-family="'SF Mono', monospace" font-size="9" font-weight="700">TENSION VECTOR</text>
  </g>

  <!-- ========================================================================
       INSET DETAIL BUBBLE: 1:5 RECIPROCAL JOINT (1:5 木節點手作榫接放大詳圖)
       ======================================================================== -->
  <g transform="translate(930, 160)">
    <!-- Detail Circle Frame -->
    <circle cx="90" cy="90" r="85" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <circle cx="90" cy="90" r="82" fill="none" stroke="#e3e1da" stroke-width="0.7"/>

    <!-- Interlocking 2x2 Timber Joint Detail -->
    <g stroke="#111111" stroke-width="1.6" fill="none">
      <!-- Member A -->
      <polygon points="35,60 115,100 115,125 35,85" fill="#dedbd0"/>
      <!-- Member B (Reciprocal Cross) -->
      <polygon points="65,40 145,80 145,105 65,65" fill="#edebe3"/>
      <!-- Steel Pin / Dowel Connection -->
      <circle cx="90" cy="88" r="4.5" fill="#a44117" stroke="#111"/>
      <line x1="90" y1="80" x2="90" y2="96" stroke="#111" stroke-width="1"/>
    </g>

    <text x="90" y="25" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" font-weight="700" fill="#111">DETAIL A · 1:5</text>
    <text x="90" y="155" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8.5" fill="#666">2"×2" 柳杉手作互承榫接節點</text>
    <text x="90" y="167" text-anchor="middle" font-family="'SF Mono', monospace" font-size="7.5" fill="#a44117">Ø10mm 阻鏽雙向不銹鋼插銷</text>

    <!-- Leader Line to Main Axon -->
    <path d="M 5,90 Q -40,110 -150,130" fill="none" stroke="#a44117" stroke-width="1" stroke-dasharray="3 2"/>
    <circle cx="-150" cy="130" r="3" fill="#a44117"/>
  </g>

  <!-- ========================================================================
       DIMENSION LINES & METRIC ANNOTATIONS
       ======================================================================== -->
  <g stroke="#666" stroke-width="0.8" font-family="'SF Mono', monospace" font-size="9" fill="#555">
    <!-- Span Dimension Left-to-Center -->
    <line x1="340" y1="695" x2="600" y2="815"/>
    <line x1="340" y1="685" x2="340" y2="705"/>
    <line x1="600" y1="805" x2="600" y2="825"/>
    <text x="445" y="770" transform="rotate(24, 445, 770)" font-weight="700">SPAN 5,600 mm</text>

    <!-- Span Dimension Center-to-Right -->
    <line x1="600" y1="815" x2="880" y2="705"/>
    <line x1="880" y1="695" x2="880" y2="715"/>
    <text x="720" y="770" transform="rotate(-23, 720, 770)" font-weight="700">LENGTH 6,200 mm</text>

    <!-- Height Dimension -->
    <line x1="310" y1="540" x2="310" y2="220"/>
    <line x1="300" y1="540" x2="320" y2="540"/>
    <line x1="300" y1="220" x2="320" y2="220"/>
    <text x="240" y="385" font-weight="700">CLEAR 3,400 mm</text>

    <!-- Graphic Scale -->
    <g transform="translate(65, 785)">
      <text x="0" y="-8" font-size="9" fill="#333" font-weight="700">GRAPHIC SCALE 1:20 (METRIC)</text>
      <rect x="0" y="0" width="40" height="5" fill="#111"/>
      <rect x="40" y="0" width="40" height="5" fill="#eee" stroke="#111" stroke-width="0.5"/>
      <rect x="80" y="0" width="40" height="5" fill="#111"/>
      <rect x="120" y="0" width="40" height="5" fill="#eee" stroke="#111" stroke-width="0.5"/>
      <text x="0" y="15" font-size="8">0</text>
      <text x="35" y="15" font-size="8">1.0m</text>
      <text x="75" y="15" font-size="8">2.0m</text>
      <text x="115" y="15" font-size="8">3.0m</text>
      <text x="155" y="15" font-size="8">4.0m</text>
    </g>

    <!-- North Arrow -->
    <g transform="translate(1080, 770)">
      <circle cx="15" cy="15" r="16" fill="none" stroke="#111" stroke-width="0.8"/>
      <polygon points="15,2 10,18 15,15 20,18" fill="#111"/>
      <text x="15" y="-3" text-anchor="middle" font-size="10" font-weight="700" fill="#111">N</text>
    </g>
  </g>
</svg>
