<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8f8f6"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e3e2de" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)" />
  <!-- Ground line & contour -->
  <path d="M 50 480 Q 200 460 400 490 T 750 470" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 3"/>
  <!-- Timber Pavilion Axonometric -->
  <g stroke="#111" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base plinth -->
    <polygon points="250,440 400,500 580,430 430,370" fill="#ebe9e1" fill-opacity="0.6"/>
    <!-- Columns -->
    <line x1="280" y1="428" x2="280" y2="230"/>
    <line x1="390" y1="472" x2="390" y2="274"/>
    <line x1="550" y1="418" x2="550" y2="220"/>
    <line x1="440" y1="374" x2="440" y2="176"/>
    <!-- Secondary timber frame -->
    <line x1="335" y1="450" x2="335" y2="252"/>
    <line x1="470" y1="445" x2="470" y2="247"/>
    <line x1="495" y1="396" x2="495" y2="198"/>
    <line x1="360" y1="401" x2="360" y2="203"/>
    <!-- Roof beam grid -->
    <polygon points="260,230 390,285 570,215 440,160" fill="#111" fill-opacity="0.06"/>
    <line x1="260" y1="230" x2="390" y2="285"/>
    <line x1="390" y1="285" x2="570" y2="215"/>
    <line x1="570" y1="215" x2="440" y2="160"/>
    <line x1="440" y1="160" x2="260" y2="230"/>
    <!-- Joists array -->
    <line x1="290" y1="213" x2="420" y2="268"/>
    <line x1="320" y1="195" x2="450" y2="250"/>
    <line x1="350" y1="178" x2="480" y2="233"/>
    <line x1="380" y1="160" x2="510" y2="215"/>
    <line x1="410" y1="143" x2="540" y2="198"/>
  </g>
  <!-- Architectural Dimension & Callouts -->
  <line x1="250" y1="520" x2="400" y2="580" stroke="#888" stroke-width="0.8"/>
  <text x="310" y="565" font-family="'Cinzel', serif, monospace" font-size="11" fill="#666" letter-spacing="2">SPAN 6,400mm</text>
  <text x="60" y="80" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="18" fill="#111" letter-spacing="3">FIG. 01 / AXONOMETRIC</text>
  <text x="60" y="105" font-family="sans-serif" font-size="11" fill="#777" letter-spacing="1">BASIC DESIGN I · TIMBER TECTONICS</text>
</svg>