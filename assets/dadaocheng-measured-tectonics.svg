<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <rect width="900" height="650" fill="#fcfbf7"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ebe8de" stroke-width="0.8"/>
    </pattern>
    <pattern id="brickHatch2" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#111" stroke-width="1.2" />
    </pattern>
  </defs>
  <rect width="900" height="650" fill="url(#grid)" />

  <!-- Title & Callout -->
  <text x="60" y="65" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="18" font-weight="700" fill="#111" letter-spacing="2">ARCADE COLUMN CAPITAL & TECTONIC CORBEL DETAIL</text>
  <text x="60" y="90" font-family="monospace" font-size="11" fill="#666" letter-spacing="1">DADAOCHENG TING-A-KHA DETAIL MEASUREMENT · SCALE 1:10</text>

  <!-- Large Detailed Column Capital & Arch Springing Drawing -->
  <!-- Main Column Shaft (圓柱身 清水紅磚造) -->
  <rect x="240" y="340" width="160" height="240" fill="url(#brickHatch2)" stroke="#111" stroke-width="2.5"/>
  <line x1="280" y1="340" x2="280" y2="580" stroke="#fff" stroke-width="2" opacity="0.4"/>
  <line x1="360" y1="340" x2="360" y2="580" stroke="#000" stroke-width="2" opacity="0.3"/>

  <!-- Necking & Astragal Band (柱頸環飾) -->
  <rect x="230" y="315" width="180" height="25" fill="#f2efe4" stroke="#111" stroke-width="2"/>
  <circle cx="255" cy="327" r="4" fill="#111"/>
  <circle cx="285" cy="327" r="4" fill="#111"/>
  <circle cx="320" cy="327" r="4" fill="#111"/>
  <circle cx="355" cy="327" r="4" fill="#111"/>
  <circle cx="385" cy="327" r="4" fill="#111"/>

  <!-- Echinus & Corinthian Acanthus Leaf Relief (泥塑莨苕葉飾) -->
  <path d="M 215 315 C 220 270 200 240 180 230 L 460 230 C 440 240 420 270 425 315 Z" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <!-- Leaf veins -->
  <path d="M 260 300 Q 240 260 210 240" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 320 300 Q 320 250 320 235" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 380 300 Q 400 260 430 240" fill="none" stroke="#111" stroke-width="1.5"/>

  <!-- Abacus Block (柱頂方蓋板) -->
  <rect x="160" y="195" width="320" height="35" fill="#f2efe4" stroke="#111" stroke-width="2.5"/>

  <!-- Architrave & Springing Arch (拱圈拱心石與起拱線) -->
  <path d="M 160 195 L 80 195 L 80 130 C 180 130 320 80 320 80 L 320 195 Z" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="80" y1="195" x2="80" y2="80" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Dimension & Annotation Lines -->
  <!-- Leader 1: Plaster Leaf Ornament -->
  <line x1="430" y1="270" x2="560" y2="230" stroke="#a44117" stroke-width="1.2"/>
  <circle cx="430" cy="270" r="3" fill="#a44117"/>
  <text x="570" y="230" font-family="'Noto Serif TC', serif" font-size="12" font-weight="700" fill="#a44117">折衷主義泥塑莨苕葉柱頭</text>
  <text x="570" y="248" font-family="monospace" font-size="10" fill="#666">Plaster Acanthus Foliage (Imported Portland Cement)</text>

  <!-- Leader 2: Abacus -->
  <line x1="480" y1="210" x2="560" y2="160" stroke="#a44117" stroke-width="1.2"/>
  <circle cx="480" cy="210" r="3" fill="#a44117"/>
  <text x="570" y="160" font-family="'Noto Serif TC', serif" font-size="12" font-weight="700" fill="#a44117">托斯卡納方盤 (Abacus)</text>
  <text x="570" y="178" font-family="monospace" font-size="10" fill="#666">Width: 640mm · Terrazzo Finish 洗石子收頭</text>

  <!-- Leader 3: Brick Pier -->
  <line x1="400" y1="420" x2="560" y2="420" stroke="#a44117" stroke-width="1.2"/>
  <circle cx="400" cy="420" r="3" fill="#a44117"/>
  <text x="570" y="420" font-family="'Noto Serif TC', serif" font-size="12" font-weight="700" fill="#a44117">日治時期特級清水紅磚柱身</text>
  <text x="570" y="438" font-family="monospace" font-size="10" fill="#666">Diameter: 520mm · TR (Taiwan Renga) 磚刻印記</text>

  <!-- Dimension Indicator -->
  <line x1="240" y1="600" x2="400" y2="600" stroke="#111" stroke-width="1"/>
  <line x1="240" y1="590" x2="240" y2="610" stroke="#111" stroke-width="1"/>
  <line x1="400" y1="590" x2="400" y2="610" stroke="#111" stroke-width="1"/>
  <text x="290" y="618" font-family="monospace" font-size="11" fill="#111">Ø 520mm</text>
</svg>