<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8f8f6"/>
  <defs>
    <pattern id="diag-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#222" stroke-width="1" />
    </pattern>
    <pattern id="fine-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e5df" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background drafting grid -->
  <rect width="800" height="600" fill="url(#fine-grid)"/>

  <!-- Border & Technical Margins -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#ccc" stroke-width="0.5"/>

  <!-- Header Title Block (Divisare Minimalist Architectural Typography) -->
  <text x="50" y="65" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="16" font-weight="700" fill="#111" letter-spacing="2">FIG. 11 / STANDARDIZED PROTOTYPE &amp; SUPERBLOCK MORPHOLOGY</text>
  <text x="50" y="85" font-family="'Aptos', -apple-system, sans-serif" font-size="10.5" fill="#666" letter-spacing="1">ELE-440 · 1970–1980s TAIWAN PUBLIC HOUSING ARCHIVAL STUDY · DA'AN &amp; CHENGGONG</text>

  <!-- Notice Banner: Awaiting User Upload -->
  <g transform="translate(470, 48)">
    <rect x="0" y="0" width="280" height="42" fill="#fff" stroke="#111" stroke-width="1.2" stroke-dasharray="4 2"/>
    <text x="140" y="18" font-family="'Aptos', sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle" letter-spacing="0.5">【 待上傳圖紙 · AWAITING UPLOAD 】</text>
    <text x="140" y="33" font-family="'Aptos', sans-serif" font-size="9" fill="#777" text-anchor="middle">隨時由「圖片管理中心」或「更換圖片」上傳</text>
  </g>

  <!-- Left Side: 1:50 Unit Floor Plan Prototype -->
  <g id="unit-prototype" transform="translate(60, 120)">
    <!-- Sub-header -->
    <text x="0" y="0" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#111">01 / TYPICAL UNIT PROTOTYPE (L+D+K &amp; SERVICE CORE)</text>
    <text x="0" y="16" font-family="monospace" font-size="9" fill="#777">SCALE 1:50 · 3-BEDROOM STANDARD 28 PING (92.5 m²)</text>

    <!-- Outer Unit Envelope -->
    <rect x="0" y="30" width="280" height="230" fill="#fff" stroke="#111" stroke-width="2"/>

    <!-- Living & Dining Axis (L+D) -->
    <rect x="10" y="40" width="150" height="130" fill="none" stroke="#222" stroke-width="1"/>
    <text x="85" y="90" font-family="'Aptos', sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="middle">LIVING (L)</text>
    <text x="85" y="145" font-family="'Aptos', sans-serif" font-size="11" font-weight="600" fill="#444" text-anchor="middle">DINING (D)</text>
    <line x1="10" y1="115" x2="160" y2="115" stroke="#999" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Front Balcony (Daylighting) -->
    <rect x="10" y="200" width="150" height="50" fill="none" stroke="#111" stroke-width="1.2"/>
    <text x="85" y="230" font-family="'Aptos', sans-serif" font-size="9.5" fill="#555" text-anchor="middle">FRONT BALCONY (陽台)</text>

    <!-- Centralized Service Core (K + BA + PIPE CHASE) -->
    <rect x="170" y="40" width="100" height="110" fill="url(#diag-hatch)" opacity="0.12"/>
    <rect x="170" y="40" width="100" height="110" fill="none" stroke="#111" stroke-width="1.5"/>
    <!-- Kitchen -->
    <rect x="170" y="40" width="100" height="55" fill="none" stroke="#222" stroke-width="1"/>
    <text x="220" y="72" font-family="'Aptos', sans-serif" font-size="10" font-weight="700" fill="#222" text-anchor="middle">KITCHEN (K)</text>
    <!-- Bathroom -->
    <rect x="170" y="95" width="100" height="55" fill="none" stroke="#222" stroke-width="1"/>
    <text x="220" y="125" font-family="'Aptos', sans-serif" font-size="10" font-weight="600" fill="#444" text-anchor="middle">BATHROOM (Ba)</text>
    <!-- Pipe Chase (Vertical Shaft) -->
    <rect x="240" y="80" width="25" height="25" fill="#111"/>
    <text x="252" y="75" font-family="monospace" font-size="7.5" fill="#111" text-anchor="middle">PIPE CHASE</text>

    <!-- Rear Utility Balcony (Service Circulation) -->
    <rect x="170" y="160" width="100" height="40" fill="none" stroke="#222" stroke-width="1"/>
    <text x="220" y="184" font-family="'Aptos', sans-serif" font-size="9" fill="#555" text-anchor="middle">UTILITY BALCONY</text>

    <!-- Private Bedrooms Zone (Quiet Zone) -->
    <rect x="10" y="280" width="130" height="90" fill="none" stroke="#222" stroke-width="1.2"/>
    <text x="75" y="325" font-family="'Aptos', sans-serif" font-size="10" font-weight="600" fill="#333" text-anchor="middle">MASTER BEDROOM</text>

    <rect x="150" y="280" width="120" height="90" fill="none" stroke="#222" stroke-width="1.2"/>
    <text x="210" y="325" font-family="'Aptos', sans-serif" font-size="10" font-weight="600" fill="#333" text-anchor="middle">BEDROOM 2</text>

    <!-- Compressed corridor node -->
    <circle cx="140" cy="275" r="4" fill="#111"/>
    <text x="140" y="265" font-family="monospace" font-size="8" fill="#777" text-anchor="middle">MINIMAL CORRIDOR</text>
  </g>

  <!-- Right Side: 1:500 Superblock Urban Fabric (Tower in the Park) -->
  <g id="superblock-morphology" transform="translate(420, 120)">
    <!-- Sub-header -->
    <text x="0" y="0" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#111">02 / SUPERBLOCK URBAN ENCLAVE (LE CORBUSIER &amp; RADBURN)</text>
    <text x="0" y="16" font-family="monospace" font-size="9" fill="#777">SCALE 1:500 · 15,000+ m² SUPERBLOCK PARCEL WITH DEFENSIVE VOID</text>

    <!-- Superblock Perimeter Base / Arterial Streets -->
    <rect x="0" y="30" width="330" height="340" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect x="-10" y="20" width="350" height="360" fill="none" stroke="#aaa" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="165" y="12" font-family="monospace" font-size="8.5" fill="#888" text-anchor="middle">▲ 20m PERIPHERAL ARTERIAL ROAD (人車分道車行動線外圍化)</text>

    <!-- Central Landscaped Courtyard / Void (Tower in the Park) -->
    <rect x="75" y="95" width="180" height="190" fill="#f0f2eb" stroke="#555" stroke-width="1"/>
    <circle cx="165" cy="190" r="45" fill="none" stroke="#778" stroke-width="0.8" stroke-dasharray="3 2"/>
    <text x="165" y="175" font-family="'Aptos', sans-serif" font-size="10.5" font-weight="700" fill="#333" text-anchor="middle">CENTRAL GREEN VOID</text>
    <text x="165" y="192" font-family="'Aptos', sans-serif" font-size="9" fill="#555" text-anchor="middle">幾何防衛中庭花園 (35% LOW BCR)</text>
    <text x="165" y="208" font-family="monospace" font-size="8" fill="#777" text-anchor="middle">DEFENSIBLE SPACE / PEDESTRIAN DECK</text>

    <!-- Underground Parking Ramp -->
    <path d="M 15 160 L 55 160 L 55 190 L 15 190 Z" fill="none" stroke="#222" stroke-width="1"/>
    <line x1="15" y1="165" x2="55" y2="185" stroke="#888" stroke-width="0.8"/>
    <text x="35" y="205" font-family="monospace" font-size="7.5" fill="#444" text-anchor="middle">PARKING RAMP</text>

    <!-- Pinwheel / 4-in-1 Residential High-Rise Towers (10-18 Storeys) -->
    <!-- Tower Block NW -->
    <g transform="translate(15, 45)">
      <rect width="65" height="45" fill="#fff" stroke="#111" stroke-width="1.8"/>
      <rect x="10" y="45" width="45" height="25" fill="#fff" stroke="#111" stroke-width="1.5"/>
      <text x="32" y="28" font-family="'Cinzel', serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">TOWER A</text>
      <text x="32" y="38" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">16F PINWHEEL</text>
    </g>

    <!-- Tower Block NE -->
    <g transform="translate(250, 45)">
      <rect width="65" height="45" fill="#fff" stroke="#111" stroke-width="1.8"/>
      <rect x="10" y="45" width="45" height="25" fill="#fff" stroke="#111" stroke-width="1.5"/>
      <text x="32" y="28" font-family="'Cinzel', serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">TOWER B</text>
      <text x="32" y="38" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">16F PINWHEEL</text>
    </g>

    <!-- Tower Block SW -->
    <g transform="translate(15, 280)">
      <rect width="65" height="45" fill="#fff" stroke="#111" stroke-width="1.8"/>
      <rect x="10" y="-25" width="45" height="25" fill="#fff" stroke="#111" stroke-width="1.5"/>
      <text x="32" y="28" font-family="'Cinzel', serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">TOWER C</text>
      <text x="32" y="38" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">18F PINWHEEL</text>
    </g>

    <!-- Tower Block SE -->
    <g transform="translate(250, 280)">
      <rect width="65" height="45" fill="#fff" stroke="#111" stroke-width="1.8"/>
      <rect x="10" y="-25" width="45" height="25" fill="#fff" stroke="#111" stroke-width="1.5"/>
      <text x="32" y="28" font-family="'Cinzel', serif" font-size="9" font-weight="700" fill="#111" text-anchor="middle">TOWER D</text>
      <text x="32" y="38" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">18F PINWHEEL</text>
    </g>

    <!-- Community Retail & Nursery Base (1-3F) -->
    <rect x="95" y="45" width="140" height="25" fill="#fff" stroke="#111" stroke-width="1"/>
    <text x="165" y="61" font-family="'Aptos', sans-serif" font-size="8.5" fill="#444" text-anchor="middle">COMMUNITY RETAIL &amp; NURSERY (自給自足機能)</text>

    <!-- Urban Enclave Severance Line -->
    <line x1="-5" y1="200" x2="335" y2="200" stroke="#c00" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="165" y="335" font-family="'Aptos', sans-serif" font-size="8.5" font-weight="700" fill="#900" text-anchor="middle">CRITIQUE: URBAN ENCLAVE (與周邊舊市區紋理隔絕之都市飛地)</text>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g transform="translate(50, 520)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="#222" stroke-width="1"/>
    <!-- North Arrow -->
    <g transform="translate(25, 25)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#111" stroke-width="1"/>
      <path d="M 0 -12 L 4 0 L 0 -3 L -4 0 Z" fill="#111"/>
      <text x="0" y="8" font-family="'Cinzel', serif" font-size="8" font-weight="700" fill="#111" text-anchor="middle">N</text>
    </g>

    <text x="60" y="18" font-family="'Cinzel', serif" font-size="10" font-weight="700" fill="#111">ARCH/FOLIO DOSSIER: ELE-440</text>
    <text x="60" y="32" font-family="'Aptos', sans-serif" font-size="9" fill="#666">YEAR 4 ELECTIVE · POST-WAR PUBLIC HOUSING MORPHOLOGY &amp; URBAN CRITIQUE</text>

    <text x="450" y="18" font-family="'Aptos', sans-serif" font-size="9" font-weight="600" fill="#222">ARCHIVAL REFERENCES:</text>
    <text x="450" y="32" font-family="'Aptos', sans-serif" font-size="8.5" fill="#666">《國宅空間原型》·《大街廓國宅社區》· 台北市大安國宅與成功國宅</text>

    <line x1="640" y1="12" x2="690" y2="12" stroke="#111" stroke-width="1.5"/>
    <line x1="640" y1="8" x2="640" y2="16" stroke="#111" stroke-width="1"/>
    <line x1="690" y1="8" x2="690" y2="16" stroke="#111" stroke-width="1"/>
    <text x="665" y="26" font-family="monospace" font-size="8" fill="#111" text-anchor="middle">10m</text>
  </g>
</svg>