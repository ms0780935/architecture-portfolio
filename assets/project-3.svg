<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8f8f6"/>
  <!-- Coastline / Sea -->
  <path d="M 0 350 C 200 380 400 310 600 360 C 700 385 750 350 800 340 L 800 600 L 0 600 Z" fill="#eae8df"/>
  <!-- Water contour lines -->
  <path d="M 0 380 C 200 410 400 340 600 390 C 700 415 750 380 800 370" fill="none" stroke="#d5d3c8" stroke-width="1.5"/>
  <path d="M 0 430 C 200 460 400 390 600 440 C 700 465 750 430 800 420" fill="none" stroke="#d5d3c8" stroke-width="1.5"/>
  <path d="M 0 490 C 200 520 400 450 600 500 C 700 525 750 490 800 480" fill="none" stroke="#d5d3c8" stroke-width="1.5"/>
  <!-- Pier / Jetty -->
  <rect x="520" y="260" width="45" height="240" fill="#fff" stroke="#111" stroke-width="2"/>
  <!-- Library Footprint -->
  <polygon points="180,240 450,210 420,380 150,350" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <line x1="270" y1="230" x2="240" y2="370" stroke="#111" stroke-width="1.2"/>
  <line x1="360" y1="220" x2="330" y2="375" stroke="#111" stroke-width="1.2"/>
  <!-- Atrium Void -->
  <circle cx="300" cy="300" r="35" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- North Arrow -->
  <g transform="translate(710, 100)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#111" stroke-width="1"/>
    <polygon points="0,-24 -6,0 6,0" fill="#111"/>
    <polygon points="0,24 -6,0 6,0" fill="none" stroke="#111" stroke-width="0.8"/>
    <text x="-4" y="-30" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#111">N</text>
  </g>
  <text x="60" y="80" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="18" fill="#111" letter-spacing="3">FIG. 03 / HARBOR SITE PLAN</text>
  <text x="60" y="105" font-family="sans-serif" font-size="11" fill="#777" letter-spacing="1">STUDIO VI · BADOUZI TIDAL COMMONS</text>
</svg>