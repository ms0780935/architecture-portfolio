<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8f8f6"/>
  <!-- Folded Plate Truss Diagram -->
  <g stroke="#111" stroke-width="1.8" fill="none" stroke-linejoin="round">
    <!-- Ridge and valleys -->
    <polygon points="120,380 240,220 360,380 480,220 600,380 680,280 560,440 440,280 320,440 200,280" fill="#f1efe7"/>
    <line x1="240" y1="220" x2="200" y2="280"/>
    <line x1="360" y1="380" x2="320" y2="440"/>
    <line x1="480" y1="220" x2="440" y2="280"/>
    <line x1="600" y1="380" x2="560" y2="440"/>
  </g>
  <!-- Timber grain accents -->
  <line x1="230" y1="235" x2="195" y2="285" stroke="#777" stroke-width="0.8"/>
  <line x1="220" y1="250" x2="190" y2="290" stroke="#777" stroke-width="0.8"/>
  <text x="60" y="80" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="18" fill="#111" letter-spacing="3">FIG. 08 / STRUCTURAL MORPHOLOGY</text>
  <text x="60" y="105" font-family="sans-serif" font-size="11" fill="#777" letter-spacing="1">TIMBER TECTONICS · GLULAM FOLDED-PLATE PROTOTYPE</text>
</svg>