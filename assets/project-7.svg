<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#f8f8f6"/>
  <!-- Baroque Pediment / Shophouse facade -->
  <path d="M 220 200 Q 400 130 580 200 L 580 480 L 220 480 Z" fill="#fff" stroke="#111" stroke-width="2"/>
  <!-- Pediment Medallion -->
  <ellipse cx="400" cy="205" rx="35" ry="25" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="385" y="210" font-family="'Cinzel', serif" font-size="11" fill="#111">1923</text>
  <!-- 3F Windows (Arched) -->
  <path d="M 260 280 L 260 250 A 25 25 0 0 1 310 250 L 310 280 Z" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 375 280 L 375 250 A 25 25 0 0 1 425 250 L 425 280 Z" fill="none" stroke="#111" stroke-width="1.5"/>
  <path d="M 490 280 L 490 250 A 25 25 0 0 1 540 250 L 540 280 Z" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- Balcony Corbel Band -->
  <line x1="220" y1="300" x2="580" y2="300" stroke="#111" stroke-width="2.5"/>
  <!-- 2F Windows (Rectangular with classical frame) -->
  <rect x="260" y="325" width="50" height="70" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="375" y="325" width="50" height="70" fill="none" stroke="#111" stroke-width="1.5"/>
  <rect x="490" y="325" width="50" height="70" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- 1F Arcade (Ting-a-kha / 騎樓拱圈) -->
  <line x1="220" y1="410" x2="580" y2="410" stroke="#111" stroke-width="2"/>
  <path d="M 270 480 L 270 445 A 50 50 0 0 1 370 445 L 370 480" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M 430 480 L 430 445 A 50 50 0 0 1 530 445 L 530 480" fill="none" stroke="#111" stroke-width="2"/>
  <text x="60" y="80" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="18" fill="#111" letter-spacing="3">FIG. 07 / VERNACULAR ELEVATION</text>
  <text x="60" y="105" font-family="sans-serif" font-size="11" fill="#777" letter-spacing="1">ARCHITECTURAL HISTORY · DADAOCHENG ARCADE SURVEY</text>
</svg>